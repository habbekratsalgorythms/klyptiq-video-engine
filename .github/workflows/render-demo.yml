name: Render downloadable demo
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Run validation
        run: python -m unittest discover -s tests -v
      - name: Fetch actual licensed-for-review Rockstar screenshots
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --silent --show-error 'https://static.metricool.com/planner/202611/7945934-file-3102169556167648104.jpeg' -o assets/lucia.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://static.metricool.com/planner/202611/7945934-file-374510237267671926.jpeg' -o assets/keys.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://static.metricool.com/planner/202611/7945934-file-13685730624239388127.jpeg' -o assets/vice.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://static.metricool.com/planner/202611/7945934-file-10394665368765891791.jpeg' -o assets/park.jpg
          curl --fail --location --retry 3 --silent --show-error 'https://static.metricool.com/planner/202611/7945934-file-15139828663160242076.jpeg' -o assets/jason.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for f in Path('assets').glob('*.jpg'):
              with Image.open(f) as im:
                  im.verify()
              print(f.name, f.stat().st_size)
          assert len(list(Path('assets').glob('*.jpg')))==5
          PY
      - name: Render narrated video with real images
        run: python render.py briefs/visual-demo.json --width 360 --height 640 -o output/Klyptiq_testvideo.mp4
      - name: Verify MP4 contains real voice and video
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 output/Klyptiq_testvideo.mp4
          ffmpeg -hide_banner -i output/Klyptiq_testvideo.mp4 -vn -af volumedetect -f null - 2>&1 | tail -25
          test -s output/Klyptiq_testvideo.mp4
      - name: Upload artifact for workflow download
        uses: actions/upload-artifact@v4
        with:
          name: Klyptiq-testvideo-MP4
          path: output/Klyptiq_testvideo.mp4
          if-no-files-found: error
          retention-days: 14
      - name: Save ready-to-download MP4 in repository
        run: |
          mkdir -p downloads
          cp output/Klyptiq_testvideo.mp4 downloads/Klyptiq_testvideo.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Klyptiq_testvideo.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add rendered Klyptiq demo MP4 [skip ci]"
            git push origin HEAD:main
          fi
