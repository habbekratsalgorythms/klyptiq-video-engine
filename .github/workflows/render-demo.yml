name: Render downloadable demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Run validation
        run: python -m unittest discover -s tests -v
      - name: Render short demo
        run: python render.py briefs/example.json --width 360 --height 640 -o output/Klyptiq_testvideo.mp4
      - name: Verify MP4 contains audio and video
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 output/Klyptiq_testvideo.mp4
          test -s output/Klyptiq_testvideo.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Klyptiq-testvideo-MP4
          path: output/Klyptiq_testvideo.mp4
          if-no-files-found: error
          retention-days: 14
