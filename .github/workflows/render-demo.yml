name: Render downloadable demo
on:
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Run validation
        run: python -m unittest discover -s tests -v
      - name: Render short demo
        run: python render.py briefs/example.json --width 360 --height 640 -o output/Klyptiq_testvideo.mp4
      - name: Verify MP4 contains audio and video
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 output/Klyptiq_testvideo.mp4
          test -s output/Klyptiq_testvideo.mp4
      - name: Upload artifact for workflow download
        uses: actions/upload-artifact@v4
        with:
          name: Klyptiq-testvideo-MP4
          path: output/Klyptiq_testvideo.mp4
          if-no-files-found: error
          retention-days: 14
      - name: Save ready-to-download MP4 in repository
        run: |
          mkdir -p downloads
          cp output/Klyptiq_testvideo.mp4 downloads/Klyptiq_testvideo.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Klyptiq_testvideo.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add rendered Klyptiq demo MP4 [skip ci]"
            git push origin HEAD:main
          fi
