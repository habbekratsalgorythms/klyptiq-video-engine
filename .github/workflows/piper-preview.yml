name: Produce local Piper voice evaluation video
on:
  push:
    branches:
      - feature/local-piper-production-gates-20261107
      - feature/cinematic-motion-overlay-20261107
    paths:
      - 'render.py'
      - 'briefs/**'
      - 'scripts/**'
      - '.github/workflows/piper-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak fonts-dejavu-core curl
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt
      - name: Install verified public-domain-source local Piper voice
        run: bash scripts/setup_piper.sh
      - name: Download Klyptiq editorial test photographs
        run: bash scripts/prepare_editorial_media.sh
      - name: Render sample with actual neural narration
        run: |
          . .venv/bin/activate
          python render.py briefs/visual-demo.json --tts piper --model models/en_US-kristin-medium.onnx \
            --quality production --motion -o output/Klyptiq_Piper_review_1080p.mp4
      - name: Verify presence of H264 video and AAC voice audio
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 output/Klyptiq_Piper_review_1080p.mp4
          ffmpeg -hide_banner -i output/Klyptiq_Piper_review_1080p.mp4 -vn -af volumedetect -f null - 2>&1 | tail -20
          test -s output/Klyptiq_Piper_review_1080p.mp4
      - name: Upload private-to-workflow review artifact (no social publishing)
        uses: actions/upload-artifact@v4
        with:
          name: Klyptiq-Piper-1080p-cinematic-review
          path: output/Klyptiq_Piper_review_1080p.mp4
          retention-days: 7
