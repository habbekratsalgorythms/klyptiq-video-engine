name: Inspect official Rockstar archive for noncommercial Klyptiq review
on:
  push:
    branches: [feature/real-footage-review-20261108]
    paths: ['.github/workflows/official-source-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download single 121 MB archive from official Rockstar CDN to temporary workspace
        run: |
          curl --fail --location --retry 3 --max-time 160 --silent --show-error \
            'https://media.rockstargames.com/VI/downloads/videos/GTAVI_Videos.zip' -o "$RUNNER_TEMP/GTAVI_Videos.zip"
          sha256sum "$RUNNER_TEMP/GTAVI_Videos.zip"
          test "$(stat -c%s "$RUNNER_TEMP/GTAVI_Videos.zip")" -gt 90000000
          test "$(stat -c%s "$RUNNER_TEMP/GTAVI_Videos.zip")" -lt 180000000
      - name: Inspect files, reject unsafe archive paths and report video dimensions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          python3 - <<'PY'
          import os,zipfile,pathlib,subprocess
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"GTAVI_Videos.zip"
          with zipfile.ZipFile(p) as z:
            files=[i for i in z.infolist() if not i.is_dir()]
            assert len(files)<=40
            assert sum(f.file_size for f in files)<900_000_000
            root=pathlib.Path(os.environ["RUNNER_TEMP"])/"rockstar_inspect"
            root.mkdir(exist_ok=True)
            for i in files:
              clean=pathlib.PurePosixPath(i.filename)
              assert not clean.is_absolute() and ".." not in clean.parts
              print("ARCHIVE_ITEM",repr(i.filename),"bytes",i.file_size,flush=True)
              if clean.suffix.lower() in {".mp4",".mov",".mkv",".webm"}:
                out=root/clean.name
                with z.open(i) as source,open(out,"wb") as dest:
                  import shutil
                  shutil.copyfileobj(source,dest)
                proc=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration:stream=width,height,codec_name", "-of","default=noprint_wrappers=1",str(out)],capture_output=True,text=True)
                print("VIDEO_INFO",clean.name,proc.returncode,proc.stdout[:380],flush=True)
          print("Inspection only. NO social publishing, no original media committed or retained.")
          PY
